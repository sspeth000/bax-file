<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BAX File / BAXL Converter</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .box {
      border: 2px dashed #888;
      border-radius: 12px;
      padding: 25px;
      margin: 20px 0;
    }

    button {
      padding: 10px 18px;
      margin-top: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
    }

    #preview {
      max-width: 100%;
      max-height: 500px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>

<body>

<h1>BAX / BAXL Converter</h1>

<div class="box">
  <h2>Encode</h2>

  <input type="file" id="encodeFile">

  <br>

  <button id="encodeButton">
    Convert to .baxl
  </button>
</div>

<div class="box">
  <h2>Decode</h2>

  <input type="file" id="decodeFile" accept=".baxl,.txt">

  <br>

  <button id="decodeButton">
    Convert .baxl back to file
  </button>

  <div id="status"></div>

  <img id="preview">
</div>

<script src="converter.js"></script>

</body>
</html>
